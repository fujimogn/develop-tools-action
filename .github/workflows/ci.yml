name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax
        run: bash -n scripts/install-tools.sh tests/run.sh
      - name: Run offline fixture tests
        run: bash tests/run.sh
